<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Project is Online!</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Main Clean Page Layout -->
  <main class="page-wrap">

    <!-- ================= HERO SECTION ================= -->
    <section class="hero-section">
      <!-- Title in Placeholder Color -->
      <h1 class="hero-heading">Your Project is Online!</h1>

      <!-- Subtitle (2 Lines) -->
      <p class="hero-subtext">
        Your project is now on the <strong>internet</strong><br>
        and ready to be shared with the <strong>world</strong>!
      </p>

      <!-- Mockup Buttons -->
      <div class="hero-buttons">
        <div class="btn-pill solid">Hello</div>
        <div class="btn-pill outline">World</div>
      </div>

      <!-- Modern Split Showcase (Card on Left, Text & Details on Right) -->
      <div class="hero-split-showcase">
        <!-- Left: Preview Card -->
        <div class="preview-card">
          <div class="preview-card-media skeleton">
            <div class="image-icon">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </div>
          </div>
          <div class="preview-card-footer">
            <div class="line sm w-70 skeleton"></div>
            <div class="preview-pills-row">
              <div class="mini-pill skeleton"></div>
              <div class="mini-pill skeleton"></div>
            </div>
          </div>
        </div>

        <!-- Right: Text & Details Skeletons -->
        <div class="preview-narrative">
          <div class="line tag skeleton"></div>
          <div class="line md w-85 skeleton"></div>
          <div class="line md w-60 skeleton"></div>

          <div class="narrative-lines">
            <div class="line xs w-100 skeleton"></div>
            <div class="line xs w-95 skeleton"></div>
            <div class="line xs w-80 skeleton"></div>
          </div>

          <!-- Feature Checklist Skeletons -->
          <div class="checklist-group">
            <div class="check-row">
              <div class="check-dot skeleton"></div>
              <div class="line xs w-65 skeleton"></div>
            </div>
            <div class="check-row">
              <div class="check-dot skeleton"></div>
              <div class="line xs w-50 skeleton"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= 3-CARD FEATURE GRID ================= -->
    <section class="cards-grid">
      <!-- Card 1 -->
      <div class="card">
        <div class="card-image skeleton">
          <div class="image-icon sm">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
        </div>
        <div class="card-content">
          <div class="line md w-70 skeleton"></div>
          <div class="line xs w-100 skeleton"></div>
          <div class="line xs w-85 skeleton"></div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="card">
        <div class="card-image skeleton">
          <div class="image-icon sm">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
        </div>
        <div class="card-content">
          <div class="line md w-60 skeleton"></div>
          <div class="line xs w-95 skeleton"></div>
          <div class="line xs w-80 skeleton"></div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="card">
        <div class="card-image skeleton">
          <div class="image-icon sm">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
        </div>
        <div class="card-content">
          <div class="line md w-75 skeleton"></div>
          <div class="line xs w-100 skeleton"></div>
          <div class="line xs w-70 skeleton"></div>
        </div>
      </div>
    </section>

    <!-- ================= METRICS SKELETON ROW ================= -->
    <section class="metrics-grid">
      <div class="metric-card">
        <div class="metric-header">
          <div class="line xs w-40 skeleton"></div>
          <div class="check-dot skeleton"></div>
        </div>
        <div class="line md w-75 skeleton"></div>
        <div class="line xs w-50 skeleton"></div>
      </div>

      <div class="metric-card">
        <div class="metric-header">
          <div class="line xs w-50 skeleton"></div>
          <div class="check-dot skeleton"></div>
        </div>
        <div class="line md w-60 skeleton"></div>
        <div class="line xs w-40 skeleton"></div>
      </div>

      <div class="metric-card">
        <div class="metric-header">
          <div class="line xs w-45 skeleton"></div>
          <div class="check-dot skeleton"></div>
        </div>
        <div class="line md w-80 skeleton"></div>
        <div class="line xs w-60 skeleton"></div>
      </div>

      <div class="metric-card">
        <div class="metric-header">
          <div class="line xs w-55 skeleton"></div>
          <div class="check-dot skeleton"></div>
        </div>
        <div class="line md w-70 skeleton"></div>
        <div class="line xs w-45 skeleton"></div>
      </div>
    </section>

    <!-- ================= NEXT STEPS WORKFLOW SKELETON ================= -->
    <section class="workflow-section">
      <div class="section-header">
        <div class="line tag skeleton"></div>
        <div class="line md w-40 skeleton"></div>
      </div>

      <div class="workflow-grid">
        <!-- Step 1 -->
        <div class="workflow-card">
          <div class="step-badge skeleton"></div>
          <div class="line sm w-80 skeleton"></div>
          <div class="line xs w-100 skeleton"></div>
          <div class="line xs w-65 skeleton"></div>
          <div class="workflow-action skeleton"></div>
        </div>

        <!-- Step 2 -->
        <div class="workflow-card">
          <div class="step-badge skeleton"></div>
          <div class="line sm w-70 skeleton"></div>
          <div class="line xs w-100 skeleton"></div>
          <div class="line xs w-80 skeleton"></div>
          <div class="workflow-action skeleton"></div>
        </div>

        <!-- Step 3 -->
        <div class="workflow-card">
          <div class="step-badge skeleton"></div>
          <div class="line sm w-85 skeleton"></div>
          <div class="line xs w-100 skeleton"></div>
          <div class="line xs w-75 skeleton"></div>
          <div class="workflow-action skeleton"></div>
        </div>
      </div>
    </section>

    <!-- ================= RESOURCES & DOCS GRID ================= -->
    <section class="resources-section">
      <div class="section-header">
        <div class="line tag skeleton"></div>
        <div class="line md w-35 skeleton"></div>
      </div>

      <div class="resources-grid">
        <div class="resource-card">
          <div class="resource-icon-wrap skeleton">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
          </div>
          <div class="resource-text">
            <div class="line sm w-60 skeleton"></div>
            <div class="line xs w-90 skeleton"></div>
          </div>
        </div>

        <div class="resource-card">
          <div class="resource-icon-wrap skeleton">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="10"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
          </div>
          <div class="resource-text">
            <div class="line sm w-70 skeleton"></div>
            <div class="line xs w-85 skeleton"></div>
          </div>
        </div>

        <div class="resource-card">
          <div class="resource-icon-wrap skeleton">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
          </div>
          <div class="resource-text">
            <div class="line sm w-50 skeleton"></div>
            <div class="line xs w-95 skeleton"></div>
          </div>
        </div>

        <div class="resource-card">
          <div class="resource-icon-wrap skeleton">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="2" y="2" width="20" height="8" rx="2" ry="2"/>
              <rect x="2" y="14" width="20" height="8" rx="2" ry="2"/>
              <line x1="6" y1="6" x2="6.01" y2="6"/>
              <line x1="6" y1="18" x2="6.01" y2="18"/>
            </svg>
          </div>
          <div class="resource-text">
            <div class="line sm w-65 skeleton"></div>
            <div class="line xs w-80 skeleton"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= CLEAN FOOTER WITH LOGO ================= -->
    <footer class="footer">
      <div class="footer-powered">
        <span class="footer-label">Powered by</span>
        <a href="https://code-host.online" class="codehost-brand" target="_blank" rel="noopener">
          <svg viewBox="0 0 1024 1024" width="18" height="18" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="70" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="512,520 820,730 512,920 204,730" stroke="currentColor" fill="#ffffff"></polygon>
            <polygon points="512,320 820,530 512,720 204,530" stroke="currentColor" fill="#ffffff"></polygon>
            <polygon points="512,120 820,320 512,520 204,320" stroke="currentColor" fill="#ffffff"></polygon>
          </svg>
          <span>Codehost</span>
        </a>
      </div>
    </footer>

  </main>

  <!-- Celebration Party Popper Canvas -->
  <canvas id="popper-canvas"></canvas>

  <script src="app.js"></script>
</body>
</html>
